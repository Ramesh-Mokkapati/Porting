name: CI

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: ${{ matrix.configuration }}|${{ matrix.platform }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # PostBuildEventUseInBuild=false skips the COMServer /RegServer post-build step.
      - name: Build
        run: |
          msbuild Porting.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PostBuildEventUseInBuild=false `
            /m `
            /v:minimal `
            /nologo

      - name: Upload x64 binaries
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }}-x64
          path: |
            Binaries/Win32/${{ matrix.configuration }}/Server.dll
            Binaries/Win32/${{ matrix.configuration }}/Client.exe
            Binaries/Win32/${{ matrix.configuration }}/COMServer.exe
            Binaries/Win32/${{ matrix.configuration }}/COMServerPS.dll
            Binaries/x64/${{ matrix.configuration }}/ClientModified.exe
            Binaries/x64/${{ matrix.configuration }}/PortAssist.exe
          if-no-files-found: warn

      - name: Upload x86 binaries
        if: matrix.platform == 'x86'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }}-x86
          path: |
            Binaries/Win32/${{ matrix.configuration }}/Genie.exe
          if-no-files-found: warn

  merge:
    name: Merge ${{ matrix.configuration }} artifacts
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Merge into single ${{ matrix.configuration }} archive
        uses: actions/upload-artifact/merge@v7
        with:
          name: ${{ matrix.configuration }}
          pattern: ${{ matrix.configuration }}-*
          delete-merged: true

  # On a v*.*.* tag, publish the Release binaries as a GitHub Release
  # (Porting-<tag>-x64.zip) laid out by bitness:
  #   x86/  Server.dll, Client.exe, COMServer.exe, COMServerPS.dll, Genie.exe
  #   x64/  ClientModified.exe, PortAssist.exe
  # COMServer.exe loads Server.dll from its own folder, so they stay together.
  # Waits for the merge job, which deletes the per-platform artifacts after
  # folding them into "Release".
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: merge
    # Every successful push to the default branch is released automatically
    # (tag v<VERSION_PREFIX>.<run number> is created); pushing a v*.*.* tag
    # yourself releases exactly that tag. Pull requests never release.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    env:
      VERSION_PREFIX: "1.1"   # major.minor of automatic versions
    permissions:
      contents: write       # required to create / update a GitHub Release
    steps:
      - name: Work out release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"
          else tag="v${VERSION_PREFIX}.${{ github.run_number }}"; fi
          echo "Release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: Release
          path: artifact

      # Locate each file by name (the merged artifact's folder layout depends on
      # how upload-artifact trimmed the paths) and fail if any is missing, since
      # the build uploads with if-no-files-found: warn.
      - name: Stage package
        run: |
          stage() {
            dest="package/$1"; shift
            mkdir -p "$dest"
            for f in "$@"; do
              found=$(find artifact -type f -name "$f")
              count=$(printf '%s' "$found" | grep -c . || true)
              if [ "$count" -ne 1 ]; then
                echo "::error::expected exactly one $f in the Release artifact, found $count"; exit 1
              fi
              cp "$found" "$dest/"
            done
          }
          stage x86 Server.dll Client.exe COMServer.exe COMServerPS.dll Genie.exe
          stage x64 ClientModified.exe PortAssist.exe
          find package -type f | sort

      - name: Zip package
        run: |
          cd package
          zip -r "../Porting-${{ steps.tag.outputs.tag }}-x64.zip" x86 x64

      # Every exe/DLL must load on a clean machine: no Debug C++ runtime (not
      # redistributable), and every DLL it imports is either next to it in the
      # package, a standard Windows DLL, or part of the VC++ 2015-2022 runtime
      # (incl. MFC) that the ComponentSuite installer requires. winspool.drv is
      # Windows' print spooler (imported by MFC apps), the one system import
      # that isn't a .dll.
      - name: Check runtime dependencies
        env:
          PKG: package
        run: |
          command -v objdump > /dev/null || { echo "::error::objdump not found, so the dependency check cannot run"; exit 1; }
          allowed='^((kernel32|kernelbase|ntdll|user32|gdi32|gdiplus|advapi32|shell32|shlwapi|ole32|oleaut32|oleacc|oledlg|comctl32|comdlg32|uxtheme|dwmapi|imm32|msimg32|winmm|version|setupapi|cfgmgr32|rstrtmgr|virtdisk|ws2_32|mswsock|iphlpapi|netapi32|dnsapi|winhttp|wininet|urlmon|webservices|crypt32|bcrypt|ncrypt|secur32|wintrust|rpcrt4|userenv|psapi|dbghelp|wtsapi32|powrprof|propsys|normaliz|wldap32|msvcrt|api-ms-win-[a-z0-9-]+|ext-ms-win-[a-z0-9-]+|msvcp140(_1|_2|_atomic_wait|_codecvt_ids)?|vcruntime140(_1)?|concrt140|vcomp140|mfc140u?|mfcm140u?|ucrtbase)\.dll|winspool\.drv)$'
          debugcrt='^(msvcp140d|msvcp140_1d|msvcp140_2d|vcruntime140d|vcruntime140_1d|concrt140d|ucrtbased|mfc140u?d|mfcm140u?d)\.dll$'
          fail=0; checked=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1)); dir=$(dirname "$f"); name=${f#"$PKG"/}
            for dep in $(objdump -p "$f" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr 'A-Z' 'a-z'); do
              if [[ $dep =~ $debugcrt ]]; then
                echo "::error::$name needs the Debug C++ runtime ($dep), which isn't redistributable"; fail=1
              elif [ -z "$(find "$dir" -maxdepth 1 -iname "$dep" -print -quit)" ] && ! [[ $dep =~ $allowed ]]; then
                echo "::error::$name needs $dep, which isn't in the package"; fail=1
              fi
            done
          done < <(find "$PKG" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$checked" -gt 0 ] || { echo "::error::no .exe/.dll files found in $PKG"; exit 1; }
          echo "Checked $checked binaries"
          exit $fail

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Porting-${{ steps.tag.outputs.tag }}-x64.zip
          generate_release_notes: true   # auto-generates notes from merged PRs / commits
          # v1.2.0-rc1 etc. become pre-releases, so they never count as the "latest" release
          # that downstream packaging (the ComponentSuite installer) picks up.
          prerelease: ${{ contains(github.ref_name, '-') }}
