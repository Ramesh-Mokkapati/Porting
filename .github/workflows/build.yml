name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: ${{ matrix.configuration }}|${{ matrix.platform }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # PostBuildEventUseInBuild=false skips the COMServer /RegServer post-build step.
      - name: Build
        run: |
          msbuild Porting.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PostBuildEventUseInBuild=false `
            /m `
            /v:minimal `
            /nologo

      - name: Upload x64 binaries
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }}-x64
          path: |
            Binaries/Win32/${{ matrix.configuration }}/Server.dll
            Binaries/Win32/${{ matrix.configuration }}/Client.exe
            Binaries/Win32/${{ matrix.configuration }}/COMServer.exe
            Binaries/Win32/${{ matrix.configuration }}/COMServerPS.dll
            Binaries/x64/${{ matrix.configuration }}/ClientModified.exe
            Binaries/x64/${{ matrix.configuration }}/PortAssist.exe
          if-no-files-found: warn

      - name: Upload x86 binaries
        if: matrix.platform == 'x86'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }}-x86
          path: |
            Binaries/Win32/${{ matrix.configuration }}/Genie.exe
          if-no-files-found: warn

  merge:
    name: Merge ${{ matrix.configuration }} artifacts
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Merge into single ${{ matrix.configuration }} archive
        uses: actions/upload-artifact/merge@v7
        with:
          name: ${{ matrix.configuration }}
          pattern: ${{ matrix.configuration }}-*
          delete-merged: true
