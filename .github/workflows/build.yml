name: CI

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: ${{ matrix.configuration }}|${{ matrix.platform }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # PostBuildEventUseInBuild=false skips the COMServer /RegServer post-build step.
      - name: Build
        run: |
          msbuild Porting.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PostBuildEventUseInBuild=false `
            /m `
            /v:minimal `
            /nologo

      - name: Upload x64 binaries
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }}-x64
          path: |
            Binaries/Win32/${{ matrix.configuration }}/Server.dll
            Binaries/Win32/${{ matrix.configuration }}/Client.exe
            Binaries/Win32/${{ matrix.configuration }}/COMServer.exe
            Binaries/Win32/${{ matrix.configuration }}/COMServerPS.dll
            Binaries/x64/${{ matrix.configuration }}/ClientModified.exe
            Binaries/x64/${{ matrix.configuration }}/PortAssist.exe
          if-no-files-found: warn

      - name: Upload x86 binaries
        if: matrix.platform == 'x86'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }}-x86
          path: |
            Binaries/Win32/${{ matrix.configuration }}/Genie.exe
          if-no-files-found: warn

  merge:
    name: Merge ${{ matrix.configuration }} artifacts
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Merge into single ${{ matrix.configuration }} archive
        uses: actions/upload-artifact/merge@v7
        with:
          name: ${{ matrix.configuration }}
          pattern: ${{ matrix.configuration }}-*
          delete-merged: true

  # On a v*.*.* tag, publish the Release binaries as a GitHub Release
  # (Porting-<tag>-x64.zip) laid out by bitness:
  #   x86/  Server.dll, Client.exe, COMServer.exe, COMServerPS.dll, Genie.exe
  #   x64/  ClientModified.exe, PortAssist.exe
  # COMServer.exe loads Server.dll from its own folder, so they stay together.
  # Waits for the merge job, which deletes the per-platform artifacts after
  # folding them into "Release".
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # required to create / update a GitHub Release
    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: Release
          path: artifact

      # Locate each file by name (the merged artifact's folder layout depends on
      # how upload-artifact trimmed the paths) and fail if any is missing, since
      # the build uploads with if-no-files-found: warn.
      - name: Stage package
        run: |
          stage() {
            dest="package/$1"; shift
            mkdir -p "$dest"
            for f in "$@"; do
              found=$(find artifact -type f -name "$f")
              count=$(printf '%s' "$found" | grep -c . || true)
              if [ "$count" -ne 1 ]; then
                echo "::error::expected exactly one $f in the Release artifact, found $count"; exit 1
              fi
              cp "$found" "$dest/"
            done
          }
          stage x86 Server.dll Client.exe COMServer.exe COMServerPS.dll Genie.exe
          stage x64 ClientModified.exe PortAssist.exe
          find package -type f | sort

      - name: Zip package
        run: |
          cd package
          zip -r "../Porting-${{ github.ref_name }}-x64.zip" x86 x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Porting-${{ github.ref_name }}-x64.zip
          generate_release_notes: true   # auto-generates notes from merged PRs / commits
          # v1.2.0-rc1 etc. become pre-releases, so they never count as the "latest" release
          # that downstream packaging (the ComponentSuite installer) picks up.
          prerelease: ${{ contains(github.ref_name, '-') }}
